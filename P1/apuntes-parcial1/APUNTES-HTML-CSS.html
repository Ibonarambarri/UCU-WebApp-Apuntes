<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #f6f7f9;
    --panel: #fff;
    --linea: #e2e5ea;
    --texto: #1b1f24;
    --tenue: #6a7280;
    --acento: #1b4f9c;
    --amarillo: #fff6e0;
    --amarillo-b: #f0d79a;
    --code-bg: #1b1f24;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --h-header: 52px;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--texto);
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    margin: 0;
    overflow: hidden;
  }

  /* ===================== HEADER ===================== */
  header {
    align-items: center;
    background: var(--panel);
    border-bottom: 1px solid var(--linea);
    display: flex;
    flex-shrink: 0;
    gap: 1.5em;
    height: var(--h-header);
    padding: 0 1.2em;
  }
  .marca { font-size: .82rem; font-weight: 700; white-space: nowrap; }
  .marca span { color: var(--tenue); font-weight: 400; }
  #tabs { display: flex; gap: .2em; overflow-x: auto; }
  #tabs button {
    background: none; border: none; border-radius: 7px; color: var(--tenue);
    cursor: pointer; font: inherit; font-size: .85rem; padding: .45em .85em; white-space: nowrap;
  }
  #tabs button:hover { background: #eef1f5; color: var(--texto); }
  #tabs button.activo { background: var(--acento); color: #fff; }

  #app { flex: 1; overflow: hidden; }
  .vista { display: none; height: 100%; }
  .vista.activa { display: grid; }

  /* ===================== VISTA PARCIALES ===================== */
  #vista-parciales { grid-template-columns: 270px 1fr; }

  aside {
    background: var(--panel); border-right: 1px solid var(--linea);
    display: flex; flex-direction: column; overflow: hidden;
  }
  aside .intro { border-bottom: 1px solid var(--linea); padding: .9em 1.1em; }
  aside .intro p { color: var(--tenue); font-size: .76rem; line-height: 1.45; margin: 0; }
  aside nav { flex: 1; overflow-y: auto; padding: .7em .6em 2em; }
  .grupo {

    margin: 1em 0 .35em; padding: 0 .5em; text-transform: uppercase;

  .grupo:first-child { margin-top: .2em; }
  aside nav button {
    background: none; border: none; border-radius: 7px; color: var(--texto); cursor: pointer;

  aside nav button.activo { background: var(--acento); color: #fff; }

  .cuerpo { display: grid; flex: 1; grid-template-rows: 1.15fr 1fr; overflow: hidden; }

  .tabs button[data-tab].activo { background: #eef1f5; font-weight: 700; }

  .pc-etq {

</style>

`* { box-sizing: border-box; }   /* SIEMPRE lo primero */

:root {
  --borde: #1b1b1b;
  --acento: #f5a623;
  --gris: #666;
  --radio: 14px;
}

body {
  color: var(--borde);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 16px;
  margin: 0;
  padding: 2vh 2vw;
}

/* 1. MARCO EXTERIOR: envuelve toda la página. Es lo que más se olvida. */
.marco {
  border: 2px solid var(--borde);
  border-radius: var(--radio);
  margin: 0 auto;                 /* centrado horizontal */
  max-width: 1200px;
  padding: 1.5em 2em 1.2em;
}

h1 { font-size: 2.1em; font-weight: normal; margin: .2em 0 .4em; text-align: center; }
.subtitulo { font-size: 1em; font-weight: normal; margin: 0 0 1.8em; text-align: center; }

/* 2. GRILLA RESPONSIVA sin una sola media query */
.grilla {
  display: grid;
  gap: 1.5em;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
}

/* 3. TARJETA: flex column da el gap uniforme entre bloques */
.caja {
  border: 2px solid var(--borde);
  border-radius: var(--radio);
  display: flex;
  flex-direction: column;
  gap: 1em;
  padding: 1em 1.2em 1.2em;
}

/* Modificadora: clase base + clase extra. Nunca dupliques la regla entera. */
.caja.destacada { border-color: var(--acento); }
.caja.destacada .ficha { border-color: var(--acento); }

/* 4. ENCABEZADO: cajita de emoji | (nombre / empresa) | etiqueta */
.encabezado { align-items: center; display: flex; gap: .9em; }

.logo {
  align-items: center;
  border: 2px solid var(--borde);
  border-radius: 12px;
  display: flex;
  flex-shrink: 0;                 /* si no, se aplasta con nombres largos */
  font-size: 1.6em;
  height: 52px;
  justify-content: center;
  width: 52px;
}

.text-encabezado { display: flex; flex-direction: column; gap: .1em; }
.text-encabezado h2, .text-encabezado h3 { margin: 0; }   /* imprescindible */
.text-encabezado h2 { font-size: 1.3em; font-weight: normal; }
.text-encabezado h3 { color: var(--gris); font-size: .85em; font-weight: normal; }

.etiqueta {
  border: 2px solid var(--acento);
  border-radius: 999px;
  color: var(--acento);
  font-size: .8em;
  margin-left: auto;              /* empuja SOLO la etiqueta a la derecha */
  padding: .35em 1em;
  white-space: nowrap;
}

.descripcion { line-height: 1.5; margin: 0; }

/* 5. FICHAS / PÍLDORAS */
.fichas {
  display: flex;
  flex-wrap: wrap;                /* sin esto se desbordan de la tarjeta */
  gap: .55em;
  margin-top: auto;               /* pega las fichas al fondo de la tarjeta:
                                     quedan alineadas entre todas */
}

.ficha {
  border: 2px solid var(--borde);
  border-radius: 999px;           /* píldora. Con 50% da una elipse deformada. */
  font-size: .82em;
  padding: .35em 1.1em;
  white-space: nowrap;            /* "razonamiento" no se parte en dos líneas */
}

/* 6. PIE: uno a cada lado */
footer {
  display: flex;
  font-size: .85em;
  justify-content: space-between;
  margin-top: 2em;
}`

* { box-sizing: border-box; }

body {
  background: #fff;
  color: var(--borde);
  font-family: "Comic Sans MS", "Segoe UI", Arial, sans-serif;
  font-size: 15px;
  margin: 0;
  padding: 2vh 2vw;
}

/* Marco exterior que envuelve el póster entero */
.marco {
  border: 2px solid var(--borde);
  border-radius: var(--radio);
  margin: 0 auto;
  max-width: 1100px;
  padding: 1.5em;
}

h1 { font-size: 2em; font-weight: normal; margin: .2em 0 .8em; text-align: center; }

/* Las columnas se ajustan solas al ancho de la ventana */

  display: grid;
  gap: 1.2em;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
}

.mision {
  border: 2px solid var(--borde);
  border-radius: var(--radio);
  padding: .8em 1em 1em;
}

/* Modificadora: las misiones que alunizaron llevan fondo gris */

  margin: 0;             /* el <ul> trae margin vertical por defecto */

footer {

  font-size: .9em;

  padding: 0 .3em;
}

@media (max-width: 480px) {
  body { font-size: 14px; }
  .tripulacion { text-align: left; }
}`

body { color: var(--negro); font-family: Georgia, "Times New Roman", serif; margin: 0; }

/* ---------- Hero: banda de color a sangre ---------- */
.hero {
  align-items: flex-start;        /* pegados arriba, no centrados */

  display: flex;
  gap: 2em;

.seccion { margin: 0 auto; max-width: 1000px; padding: 2.5em 2em; }

.subtitulo { font-size: .8rem; margin: .6em 0 2em; text-align: center; }

/* Ilustración a un lado, lista al otro */
.seccion-contenido {
  align-items: flex-start;
  display: flex;
  gap: 3em;
}

/* EL TRUCO del zigzag: misma clase + una modificadora que invierte la fila */
.seccion-contenido.invertida { flex-direction: row-reverse; }

.ilustracion { flex: 0 0 30%; font-size: 6rem; line-height: 1; text-align: center; }

  background: #fff;
  margin: 0 auto;
  max-width: 800px;
  padding: 2.5em 3em;
}

/* Cada sección se separa con una línea.
   El combinador ">" (hijo directo) evita que la regla afecte
   a secciones anidadas dentro de otra sección. */
.cv > section {
  border-top: 1px solid var(--linea);
  padding: 1.8em 0;
}

h2 { font-size: 1rem; margin: 0 0 1.1em; }

/* ---------- Encabezado: avatar redondo + rol/nombre ---------- */
.encabezado { align-items: center; display: flex; gap: 1.5em; padding-bottom: 1.8em; }

.foto {
  align-items: center;
  background: #f0f0f0;
  border-radius: 50%;           /* círculo perfecto SOLO porque es cuadrado */
  display: flex;
  flex-shrink: 0;
  font-size: 2rem;
  height: 72px;
  justify-content: center;
  width: 72px;
}

.rol {
  color: var(--tenue);
  font-size: .75rem;
  letter-spacing: .14em;        /* el look "etiqueta" típico de los CV */
  margin: 0 0 .3em;
  text-transform: uppercase;
}
h1 { font-size: 1.8rem; margin: 0; }

/* ---------- Bloque de dos columnas ---------- */
.dos-columnas {
  display: grid;
  gap: 3em;
  grid-template-columns: 1fr 1fr;
}

.parrafo { color: #555; font-size: .85rem; line-height: 1.7; margin: 0; }

/* ---------- Viñetas propias con ::before ---------- */
.contacto, .logros { color: #555; font-size: .85rem; list-style: none; margin: 0; padding: 0; }

/* padding-left deja el hueco, position:relative es el ancla del ::before */
.contacto li, .logros li { line-height: 1.7; padding-left: 1.2em; position: relative; }
.contacto li::before { color: var(--linea); content: "•"; left: 0; position: absolute; }
.logros  li::before { content: "·"; font-weight: 700; left: .3em; position: absolute; }

/* ---------- Ítem: título a la izquierda, período a la derecha ---------- */
.item { margin-bottom: 1.4em; }

.item-cabecera {
  align-items: baseline;        /* alinea por la línea de base del texto,
                                   no por el alto de la caja. Queda mejor
                                   cuando los tamaños de fuente difieren. */
  display: flex;
  gap: 1em;
  justify-content: space-between;
}

.item h3 { font-size: .92rem; margin: 0 0 .4em; }
.periodo { color: var(--tenue); font-size: .75rem; white-space: nowrap; }

/* ---------- Grilla de logos ---------- */
.tecnologias { display: flex; flex-wrap: wrap; gap: 1em; list-style: none; margin: 0; padding: 0; }
.tecnologias li {
  align-items: center;
  border: 1px solid var(--linea);
  border-radius: 4px;
  display: flex;
  font-size: 1.6rem;
  height: 62px;
  justify-content: center;
  width: 62px;
}

@media (max-width: 640px) {
  .cv { padding: 2em 1.5em; }
  .dos-columnas { gap: 2em; grid-template-columns: 1fr; }
  .item-cabecera { flex-direction: column; }
}`

<ul class="lista">
  <li><strong>Min 0-3 · Leé el diseño.</strong> ¿Hay marco exterior? ¿Cuántas columnas? ¿Qué se repite? ¿Cuál tarjeta es distinta? ¿Qué hay en el pie?</li>
  <li><strong>Min 3-6 · Escribí el HTML entero primero</strong>, sin CSS. Semántico: <code>main</code>, <code>section</code>, <code>article</code>, <code>header</code>, <code>footer</code>. Una tarjeta bien y después copiá y pegá.</li>
  <li><strong>Min 6-8 · El reset y el contenedor.</strong> <code>* { box-sizing: border-box }</code>, <code>body { margin: 0; font-family; padding }</code>, <code>.marco { margin: 0 auto; max-width }</code>.</li>
  <li><strong>Min 8-12 · La grilla y la tarjeta.</strong> Primero que se acomoden las cajas, después los detalles de adentro.</li>
  <li><strong>Min 12-16 · Los detalles:</strong> márgenes en cero, tamaños de fuente, pesos, la modificadora de la tarjeta destacada.</li>

  <li><strong>Min 18-20 · Repasá contra la imagen</strong> elemento por elemento y contá los datos (fichas, ítems) uno por uno.</li>

  <li><code>flex-shrink: 0</code> en los iconos de tamaño fijo.</li>

/* ---------- escapado y resaltado ---------- */
function escapar(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function resaltar(codigo, lenguaje) {
  let out = escapar(codigo);
  if (lenguaje === "css") {
    out = out.replace(/\/\*[\s\S]*?\*\//g, (m) => '<span class="cmt">' + m + "</span>");
    out = out.split("\n").map((l) =>
      l.includes("<span") ? l : l.replace(/^(\s*)([a-z-]+)(\s*:)/, '$1<span class="prop">$2</span>$3')
    ).join("\n");
  } else {
    out = out.replace(/&lt;!--[\s\S]*?--&gt;/g, (m) => '<span class="cmt">' + m + "</span>");
    out = out.split("\n").map((l) => {
      if (l.includes("<span")) return l;
      // El orden importa: primero atributos, después nombres de etiqueta.
      // Al revés, el segundo replace matchearía el class="tag" que insertamos.
      return l
        .replace(/([a-zA-Z-]+)="([^"]*)"/g, '<span class="atr">$1</span>=<span class="str">"$2"</span>')
        .replace(/&lt;(\/?)([a-zA-Z0-9-]+)/g, '&lt;$1<span class="tag">$2</span>');
    }).join("\n");
  }
  return out;
}

function documentoDemo(css, html) {
  return '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">' +
         '<meta name="viewport" content="width=device-width, initial-scale=1">' +
         "<style>" + css + "</style></head><body>" + html + "</body></html>";
}

async function copiar(texto, boton, etiquetaOriginal) {
  try {
    await navigator.clipboard.writeText(texto);
    boton.textContent = "¡copiado!";
  } catch {
    boton.textContent = "no se pudo";
  }
  setTimeout(() => { boton.textContent = etiquetaOriginal; }, 1200);
}

/* ---------- vista PARCIALES ---------- */
const navParciales = document.getElementById("nav-parciales");
const preview = document.getElementById("preview");
const pCodigo = document.getElementById("p-codigo");
let parcialActual = PARCIALES[0];
let pTab = "html";

function pintarNavParciales() {
  navParciales.replaceChildren();
  let grupo = null;
  for (const caso of PARCIALES) {
    if (caso.grupo !== grupo) {
      grupo = caso.grupo;
      const h = document.createElement("div");
      h.className = "grupo";
      h.textContent = grupo;
      navParciales.append(h);
    }
    const b = document.createElement("button");
    b.textContent = caso.titulo;
    const n = document.createElement("span");
    n.className = "n";
    n.textContent = caso.origen;
    b.append(n);
    b.classList.toggle("activo", caso.id === parcialActual.id);
    b.addEventListener("click", () => mostrarParcial(caso));
    navParciales.append(b);
  }
}

function mostrarParcial(caso) {
  parcialActual = caso;

  const titulo = document.getElementById("p-titulo");
  titulo.textContent = caso.titulo;
  const badge = document.createElement("span");
  badge.className = "origen";
  badge.textContent = caso.origen;
  titulo.append(badge);

  document.getElementById("p-resumen").textContent = caso.resumen;
  document.getElementById("p-claves").replaceChildren(...caso.claves.map((k) => {
    const li = document.createElement("li");
    li.textContent = k;
    return li;
  }));

  preview.srcdoc = documentoDemo(caso.css, caso.html);
  pCodigo.innerHTML = resaltar(pTab === "html" ? caso.html : caso.css, pTab);
  pintarNavParciales();
}

document.querySelectorAll("#vista-parciales .tabs button[data-tab]").forEach((b) => {
  b.addEventListener("click", () => {
    pTab = b.dataset.tab;
    document.querySelectorAll("#vista-parciales .tabs button[data-tab]")
      .forEach((o) => o.classList.toggle("activo", o === b));
    pCodigo.innerHTML = resaltar(pTab === "html" ? parcialActual.html : parcialActual.css, pTab);
  });
});

document.querySelectorAll("#vista-parciales .barra button[data-w]").forEach((b) => {
  b.addEventListener("click", () => {
    document.querySelectorAll("#vista-parciales .barra button[data-w]")
      .forEach((o) => o.classList.toggle("activo", o === b));
    const w = Number(b.dataset.w);
    preview.style.width = w ? w + "px" : "100%";
  });
});

document.getElementById("p-copiar").addEventListener("click", (e) =>
  copiar(pTab === "html" ? parcialActual.html : parcialActual.css, e.target, "Copiar"));

/* ---------- vistas de APUNTES ---------- */
const app = document.getElementById("app");
const iframesDemo = [];

function ajustarIframe(marco) {
  try {
    const doc = marco.contentDocument;
    if (doc && doc.body) {
      marco.style.height = Math.max(60, doc.documentElement.scrollHeight) + "px";
    }
  } catch { /* si el navegador lo bloquea, queda la altura por defecto */ }
}

function ajustarTodos() { iframesDemo.forEach(ajustarIframe); }

function construirDocApuntes(doc) {
  const vista = document.createElement("div");
  vista.className = "vista vista-apuntes";
  vista.id = "vista-" + doc.id;

  /* --- columna izquierda: el documento --- */
  const col = document.createElement("div");
  col.className = "doc";

  const h2 = document.createElement("h2");
  h2.className = "titulo-doc";
  h2.textContent = doc.titulo;
  const intro = document.createElement("p");
  intro.className = "intro-doc";
  intro.textContent = doc.intro;
  const nota = document.createElement("p");
  nota.className = "intro-doc";
  nota.innerHTML = "Cada demo se renderiza aislado. Para que el código de abajo " +
    "hable solo del patrón, se le inyecta este reset que no se muestra: " +
    "<code>* { box-sizing: border-box }</code> y un <code>body</code> con " +
    "<code>font-family: Arial</code>, <code>margin: 0</code> y <code>padding: 14px</code>.";
  col.append(h2, intro, nota);

  /* --- columna derecha: el panel de código --- */
  const panel = document.createElement("div");
  panel.className = "panel-codigo";

  const pcTitulo = document.createElement("span");
  pcTitulo.className = "t";
  const btnCerrar = document.createElement("button");
  btnCerrar.textContent = "✕ cerrar";
  const pcCab = document.createElement("div");
  pcCab.className = "pc-cabecera";
  pcCab.append(pcTitulo, btnCerrar);

  const mitadHtml = crearMitad("HTML");
  const mitadCss = crearMitad("CSS");
  panel.append(pcCab, mitadHtml.nodo, mitadCss.nodo);

  let abierta = null;   /* el botón "Ver código" que está abierto */

  function cerrar() {
    vista.classList.remove("con-codigo");
    if (abierta) {
      abierta.boton.classList.remove("abierto");
      abierta.boton.textContent = "Ver código";
      abierta.seccion.classList.remove("resaltada");
      abierta = null;
    }
    setTimeout(ajustarTodos, 260);
  }

  function abrir(sec, boton, nodoSeccion) {
    if (abierta && abierta.boton === boton) { cerrar(); return; }
    /* si había otra abierta, se cierra sola y se cambia el contenido */
    if (abierta) {
      abierta.boton.classList.remove("abierto");
      abierta.boton.textContent = "Ver código";
      abierta.seccion.classList.remove("resaltada");
    }
    abierta = { boton, seccion: nodoSeccion };
    boton.classList.add("abierto");
    boton.textContent = "Ocultar código";
    nodoSeccion.classList.add("resaltada");

    pcTitulo.textContent = sec.titulo;
    mitadHtml.pintar(sec.html, "html");
    mitadCss.pintar(sec.css, "css");
    vista.classList.add("con-codigo");
    setTimeout(ajustarTodos, 260);
  }

  btnCerrar.addEventListener("click", cerrar);

  /* --- las secciones --- */
  for (const sec of doc.secciones) {
    const nodo = document.createElement("section");
    nodo.className = "seccion";

    const cab = document.createElement("div");
    cab.className = "sec-cabecera";
    const h3 = document.createElement("h3");
    h3.textContent = sec.titulo;
    const p = document.createElement("p");
    p.className = "nota";
    p.textContent = sec.nota;
    cab.append(h3, p);

    if (sec.claves) {
      const ul = document.createElement("ul");
      ul.className = "claves";
      ul.append(...sec.claves.map((k) => {
        const li = document.createElement("li");
        li.textContent = k;
        return li;
      }));
      cab.append(ul);
    }

    const acciones = document.createElement("div");
    acciones.className = "sec-acciones";
    const btn = document.createElement("button");
    btn.className = "ver-codigo";
    btn.textContent = "Ver código";
    btn.addEventListener("click", () => abrir(sec, btn, nodo));
    acciones.append(btn);
    cab.append(acciones);

    const demo = document.createElement("div");
    demo.className = "sec-demo";
    const marco = document.createElement("iframe");
    marco.title = sec.titulo;
    marco.setAttribute("scrolling", "no");
    marco.style.height = "120px";
    marco.srcdoc = documentoDemo(BASE_DEMO + "\n" + sec.css, sec.html);
    marco.addEventListener("load", () => {
      ajustarIframe(marco);
      setTimeout(() => ajustarIframe(marco), 120);   /* tras cargar los emojis */
    });
    iframesDemo.push(marco);
    demo.append(marco);

    nodo.append(cab, demo);
    col.append(nodo);
  }

  vista.append(col, panel);
  return vista;
}

function crearMitad(etiqueta) {
  const nodo = document.createElement("div");
  nodo.className = "pc-mitad";

  const etq = document.createElement("div");
  etq.className = "pc-etq";
  const txt = document.createElement("span");
  txt.textContent = etiqueta;
  const sep = document.createElement("span");
  sep.className = "sep";
  const btn = document.createElement("button");
  btn.textContent = "copiar";
  etq.append(txt, sep, btn);

  const pre = document.createElement("pre");
  const code = document.createElement("code");
  pre.append(code);
  nodo.append(etq, pre);

  let crudo = "";
  btn.addEventListener("click", () => copiar(crudo, btn, "copiar"));

  return {
    nodo,
    pintar(codigo, lenguaje) {
      crudo = codigo;
      code.innerHTML = resaltar(codigo, lenguaje);
      pre.scrollTop = 0;
    },
  };
}

/* ---------- vista COMPARATIVA ---------- */
function construirComparativa() {
  const vista = document.createElement("div");
  vista.className = "vista vista-apuntes";
  vista.id = "vista-comparativa";
  const col = document.createElement("div");
  col.className = "doc";
  col.innerHTML = COMPARATIVA;
  vista.append(col);
  return vista;
}

/* ---------- pestañas ---------- */
const tabsNav = document.getElementById("tabs");
const VISTAS = [{ id: "parciales", tab: "Parciales" }];

for (const doc of APUNTES) {
  app.append(construirDocApuntes(doc));
  VISTAS.push({ id: doc.id, tab: doc.tab });
}
app.append(construirComparativa());
VISTAS.push({ id: "comparativa", tab: "Comparativa" });

function activarVista(id) {
  document.querySelectorAll(".vista").forEach((v) => v.classList.toggle("activa", v.id === "vista-" + id));
  tabsNav.querySelectorAll("button").forEach((b) => b.classList.toggle("activo", b.dataset.id === id));
  setTimeout(ajustarTodos, 60);
}

for (const v of VISTAS) {
  const b = document.createElement("button");
  b.textContent = v.tab;
  b.dataset.id = v.id;
  b.addEventListener("click", () => activarVista(v.id));
  tabsNav.append(b);
}

window.addEventListener("resize", () => {
  clearTimeout(window.__t);
  window.__t = setTimeout(ajustarTodos, 150);
});

mostrarParcial(PARCIALES[0]);
activarVista("parciales");
</script>
