`/*
# Ejercicio 02.

Implementar la función que toma una lista de datos de modelos de IA como los del
archivo \`modelos.json\` y retorna las siglas de los modelos que soportan una
capacidad dada. Por ejemplo:

    modelosPorCapacidad(modelos, "web")  // Búsqueda web

debería devolver:

    ["GPT", "GRK", "PPX"]

Si un elemento no tiene alguna de las propiedades requeridas, se debe arrojar un
error.
*/

export function modelosPorCapacidad(data, capacidad) {
  // 1. VALIDAR EL CONTENEDOR.
  //    Cubre los casos undefined y null de una sola vez.
  if (!Array.isArray(data)) {
    throw new TypeError("El primer argumento debe ser un array de modelos.");
  }

  const siglas = [];

  for (const modelo of data) {
    // 2. VALIDAR CADA ELEMENTO.
    //    typeof null === "object", por eso hace falta el !== null.
    if (
      typeof modelo !== "object" || modelo === null ||
      typeof modelo.sigla !== "string" || !Array.isArray(modelo.capacidades)
    ) {
      throw new TypeError("Cada modelo debe tener sigla y capacidades.");
    }

    // 3. FILTRAR. Con capacidad === undefined, includes da false:
    //    por eso modelosPorCapacidad(modelos) devuelve [] y no explota.
    if (modelo.capacidades.includes(capacidad)) {
      siglas.push(modelo.sigla);
    }
  }

  return siglas;
}

        throw new TypeError("...");
      }
      return m.capacidades.includes(capacidad);
    })
    .map((m) => m.sigla);
}
*/` },

`/**
 * EJERCICIO DE PARCIAL: SISTEMA DE GESTIÓN DE BIBLIOTECA UNIVERSITARIA
 *
 * Ejecutar con: node ejercicio_biblioteca.js
 */

// En Node moderno el atributo correcto es \`with\` (antes era \`assert\`).
import bibliotecaData from './datos_biblioteca.json' with { type: 'json' };

// Copia (superficial) de los datos para trabajar con ellos.
const biblioteca = { ...bibliotecaData };

/**
 * 1. Función para prestar un libro
 *
 * @param {number} idLibro - ID del libro a prestar
 * @param {number} idEstudiante - ID del estudiante que pide prestado
 * @param {string} fechaPrestamo - Fecha del préstamo (formato YYYY-MM-DD)
 * @return {boolean|string} - true si se prestó, mensaje de error si no
 */
function prestarLibro(idLibro, idEstudiante, fechaPrestamo) {
  // VALIDACIONES EN CASCADA: cada una con su propio return.
  const libro = biblioteca.libros.find((l) => l.id === idLibro);
  if (!libro) {
    return \`Error: no existe un libro con id \${idLibro}.\`;
  }

  const estudiante = biblioteca.estudiantes.find((e) => e.id === idEstudiante);
  if (!estudiante) {
    return \`Error: no existe un estudiante con id \${idEstudiante}.\`;
  }

  if (!libro.disponible) {
    return \`Error: el libro "\${libro.titulo}" no está disponible.\`;
  }

  // Formato de fecha con expresión regular: 4 dígitos - 2 dígitos - 2 dígitos
  if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(fechaPrestamo)) {
    return \`Error: la fecha "\${fechaPrestamo}" no tiene el formato YYYY-MM-DD.\`;
  }

  if (estudiante.librosActuales.includes(idLibro)) {
    return \`Error: \${estudiante.nombre} ya tiene prestado "\${libro.titulo}".\`;
  }

  // ACTUALIZAR LOS TRES REGISTROS. Olvidarse de uno es el error típico.
  libro.disponible = false;
  libro.prestamos.push({
    estudiante: estudiante.nombre,
    fechaPrestamo,
    fechaDevolucion: null,      // null = préstamo todavía abierto
  });
  estudiante.librosActuales.push(idLibro);

  return true;
}

/**
 * 2. Función para buscar libros
 *
 * Criterios soportados: titulo, autor, categoria (subcadena, sin distinguir
 * mayúsculas), disponible (booleano) y añoPublicacion (número exacto).
 *
 * @param {object} criterios - Objeto con los criterios de búsqueda
 * @return {array} - Array con los libros que cumplen los criterios
 */
function buscarLibros(criterios = {}) {
  const contiene = (valor, buscado) =>
    String(valor).toLowerCase().includes(String(buscado).toLowerCase());

  // EL PATRÓN: "no me pasaron el criterio" O "el criterio coincide".
  // Si no te lo pasaron, esa condición vale true y no filtra nada.
  return biblioteca.libros.filter((libro) => (
    (criterios.titulo === undefined || contiene(libro.titulo, criterios.titulo))
    && (criterios.autor === undefined || contiene(libro.autor, criterios.autor))
    && (criterios.categoria === undefined || contiene(libro.categoria, criterios.categoria))
    && (criterios.disponible === undefined || libro.disponible === criterios.disponible)
    && (criterios.añoPublicacion === undefined || libro.añoPublicacion === criterios.añoPublicacion)
  ));
}

console.log(prestarLibro(99, 3, "2025-09-13"));   // libro inexistente

/**
 * 1. Función para devolver un libro
 * @return {boolean|string} - true si se devolvió, mensaje de error si no
 */
function devolverLibro(idLibro, idEstudiante, fechaDevolucion) {
  const libro = biblioteca.libros.find((l) => l.id === idLibro);
  if (!libro) {
    return \`Error: no existe un libro con id \${idLibro}.\`;
  }

    return \`Error: la fecha "\${fechaDevolucion}" no tiene el formato YYYY-MM-DD.\`;
  }

  // EL PRÉSTAMO ABIERTO es el que tiene fechaDevolucion en null.
  // Un libro puede tener varios préstamos históricos; el abierto es uno solo.
  const prestamo = libro.prestamos.find((p) => (
    p.estudiante === estudiante.nombre && p.fechaDevolucion === null
  ));
  if (!prestamo) {
    return \`Error: \${estudiante.nombre} no tiene prestado "\${libro.titulo}".\`;
  }

  // Las fechas ISO (YYYY-MM-DD) se comparan como strings sin problema.
  if (fechaDevolucion < prestamo.fechaPrestamo) {
    return \`Error: la devolución no puede ser anterior al préstamo (\${prestamo.fechaPrestamo}).\`;
  }

  prestamo.fechaDevolucion = fechaDevolucion;
  libro.disponible = true;
  // Quitar del array reasignando el filtrado: más simple que splice.
  estudiante.librosActuales = estudiante.librosActuales.filter((id) => id !== idLibro);

 * @param {boolean} incluirDetallesEstudiante - Si es true, incluir datos del estudiante
 * @return {array} - Lista de libros prestados
 */
function listarLibrosPrestados(incluirDetallesEstudiante = false) {
  // flatMap: devolver [] descarta el elemento, devolver [x] lo incluye.
  // Filtra y transforma en UNA sola pasada.
  return biblioteca.libros
    .flatMap((libro) => {

    });
}

`/*
# Ejercicio 02.

Se necesita generar expresiones aritméticas simples aleatorias para una app web
de matemáticas. Las expresiones pueden ser sumas, restas, multiplicaciones o
divisiones entre números.

Se debe implementar la función de generación genExp, que toma un resultado y
retorna una expresión aleatoria. Por ejemplo:

+ genExp(5)  = { operator: '+', left: 2,  right: 3 }
+ genExp(6)  = { operator: '*', left: 2,  right: 3 }
+ genExp(11) = { operator: '-', left: 20, right: 9 }
+ genExp(2)  = { operator: '/', left: 8,  right: 4 }

Sugerencia: Usar \`Math.random()\` para generar números aleatorios.
*/

const OPERATORS = ['+', '-', '*', '/'];

/* Entero aleatorio en [min, max] (ambos incluidos). */
function randomInt(min, max) {
  return min + Math.floor(Math.random() * (max - min + 1));
}

/* Divisores de n: necesarios para que la multiplicación dé exacta. */
function divisors(n) {
  const result = [];
  for (let i = 1; i <= Math.abs(n); i += 1) {
    if (n % i === 0) {
      result.push(i);
    }
  }
  return result;
}

export function genExp(result) {
  if (!Number.isInteger(result)) {
    throw new TypeError('genExp espera un número entero.');
  }

  // Con 0 no se puede usar * ni / de forma interesante: se descartan.
  const candidates = result === 0 ? ['+', '-'] : OPERATORS;
  const operator = candidates[randomInt(0, candidates.length - 1)];

  // EN TODOS LOS CASOS: se elige un operando al azar y se DESPEJA el otro.
  switch (operator) {
    case '+': {
      // left + right = result  =>  right = result - left
      const left = randomInt(1, Math.max(1, Math.abs(result)) * 2);
      return { operator, left, right: result - left };
    }
    case '-': {
      // left - right = result  =>  left = result + right
      const right = randomInt(1, 20);
      return { operator, left: result + right, right };
    }
    case '*': {
      // left * right = result  =>  left tiene que ser DIVISOR de result
      const divs = divisors(result);
      const left = divs[randomInt(0, divs.length - 1)];
      return { operator, left, right: result / left };
    }
    default: {
      // left / right = result  =>  left = result * right (división exacta)
      const right = randomInt(1, 10);
      return { operator: '/', left: result * right, right };
    }
  }
}

/* Evalúa la expresión. Sirve para verificar lo generado. */
export function evalExp({ operator, left, right }) {
  switch (operator) {
    case '+': return left + right;
    case '-': return left - right;
    case '*': return left * right;
    case '/': return left / right;
    default: throw new Error(\`Operador desconocido: \${operator}\`);
  }
}` },

// ── Versión con métodos (la más corta) ─────────────────────────
export function modelosPorCapacidad(data, capacidad) {
  return data
    .filter((m) => m.capacidades.includes(capacidad))   // quién entra
    .map((m) => m.sigla);                               // qué se devuelve
}

// ── Versión con for...of (la más fácil de debuggear) ───────────
export function modelosPorCapacidad(data, capacidad) {
  const siglas = [];
  for (const m of data) {
    if (m.capacidades.includes(capacidad)) {
      siglas.push(m.sigla);
    }
  }
  return siglas;
}

// ── Versión con flatMap (una sola pasada) ──────────────────────
export function modelosPorCapacidad(data, capacidad) {
  return data.flatMap((m) =>
    m.capacidades.includes(capacidad) ? [m.sigla] : []
  );
}

// ── A. for...of (la más clara, la que conviene en la prueba) ───
export function fieldListToObject(fieldList) {
  if (fieldList == null) throw new Error("...");

  const result = {};
  for (const item of fieldList) {
    if (item != null && "field" in item) {
      result[item.field] = item.value;
      //     ↑ CORCHETES: la clave es el VALOR de item.field.
      //       Con punto (result.field) crearías la propiedad "field".
    }
  }
  return result;
}

// ── B. reduce ──────────────────────────────────────────────────
export function fieldListToObject(fieldList) {
  if (fieldList == null) throw new Error("...");

  return fieldList.reduce((acc, item) => {
    if (item != null && "field" in item) {
      acc[item.field] = item.value;
    }
    return acc;          // ← SIN ESTO, la vuelta siguiente recibe undefined
  }, {});                //   ↑ el valor inicial del acumulador
}

   flatMap: DESCARTAR O TRANSFORMAR, EN UNA SOLA PASADA
   ══════════════════════════════════════════════════════════════ */

function listarLibrosPrestados(conDetalles = false) {
  return biblioteca.libros.flatMap((libro) => {
    const prestamo = libro.prestamos.find((p) => p.fechaDevolucion === null);

    if (!prestamo) {
      return [];          // ← array vacío: este libro NO aparece
    }

    const info = {
      id: libro.id,
      titulo: libro.titulo,
      fechaPrestamo: prestamo.fechaPrestamo,   // ← usa el mismo 'prestamo'
    };

    if (!conDetalles) {
      return [info];      // ← un elemento: aparece así
    }

    const est = biblioteca.estudiantes.find((e) => e.nombre === prestamo.estudiante);
    return [{
      ...info,            // spread: copia todo lo de info...
      estudiante: est ? { nombre: est.nombre, carrera: est.carrera } : null,
    }];                   // ...y le suma una propiedad

/* ══════════════════════════════════════════════════════════════
   LOS CUATRO QUE VAS A VER
   ══════════════════════════════════════════════════════════════ */

// ── ok: el valor tiene que ser truthy ──────────────────────────
assert.ok(typeof f === "function", "mensaje si falla");

// ── equal: compara con == (para primitivos) ───────────────────
assert.equal(typeof f, "function");
assert.equal(1 + 1, 2);

// ── deepEqual: compara CONTENIDO (para arrays y objetos) ──────
assert.deepEqual([1, 2], [1, 2]);              // ✔
assert.deepEqual({ a: 1 }, { a: 1 });          // ✔
assert.equal([1, 2], [1, 2]);                  // ✘ objetos distintos

// ── throws: la función tiene que arrojar ──────────────────────
assert.throws(() => f(undefined));             // ✔ con flecha
assert.throws(f(undefined));                   // ✘ la llamás vos

   DETALLES QUE IMPORTAN
   ══════════════════════════════════════════════════════════════ */

assert.deepEqual(["A", "B"], ["B", "A"]);      // ✘ falla

// El orden NO importa en objetos:
assert.deepEqual({ a: 1, b: 2 }, { b: 2, a: 1 });  // ✔ pasa

assert.deepEqual([1], ["1"]);                  // ✔ pasa (!)

const VISTAS = [PARCIALES, VALIDACION, RECORRER, TRANSFORMAR, TESTS, CHULETA];

/* ---------- escapado y resaltado ---------- */
function escapar(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const PALABRAS = new RegExp(
  "\\b(const|let|var|function|return|if|else|for|of|in|while|switch|case|default|" +
  "break|continue|throw|new|typeof|instanceof|export|import|from|with|class|" +
  "try|catch|finally|async|await|true|false|null|undefined|this)\\b", "g");

function resaltar(codigo, lenguaje) {
  let out = escapar(codigo);
  if (lenguaje === "texto") return out;

  // 1. Comentarios y strings primero, reemplazados por un marcador para que
  //    los pasos siguientes no los toquen.
  const guardado = [];
  const guardar = (clase) => (m) => {
    guardado.push('<span class="' + clase + '">' + m + "</span>");
    // El marcador es un carácter del área de uso privado de Unicode: así
    // ni el paso de números ni el de palabras clave lo tocan.
    return String.fromCharCode(0xE100 + guardado.length - 1);
  };
  out = out.replace(/\/\*[\s\S]*?\*\//g, guardar("cmt"));
  out = out.replace(/\/\/[^\n]*/g, guardar("cmt"));
  out = out.replace(/`(?:[^`\\]|\\.)*`/g, guardar("str"));
  out = out.replace(/"(?:[^"\\\n]|\\.)*"/g, guardar("str"));
  out = out.replace(/'(?:[^'\\\n]|\\.)*'/g, guardar("str"));

  // 2. Sobre lo que queda: palabras clave, números y nombres de función.
  if (lenguaje !== "json") {
    out = out.replace(PALABRAS, '<span class="kw">$1</span>');
    out = out.replace(/\b(\d[\d_.]*)\b/g, '<span class="num">$1</span>');
    out = out.replace(/\b([a-zA-Z_$][\w$]*)(?=\()/g, '<span class="fn">$1</span>');
  } else {
    out = out.replace(/\b(\d[\d_.]*)\b/g, '<span class="num">$1</span>');
  }

  // 3. Devolver los comentarios y strings a su lugar.
  return out.replace(/[\uE100-\uF8FF]/g, (ch) => guardado[ch.charCodeAt(0) - 0xE100]);
}

/* ---------- assert de juguete, para el botón "Ejecutar" ---------- */
function iguales(a, b) {
  if (a === b) return true;
  if (typeof a !== "object" || typeof b !== "object" || a === null || b === null) {
    return a == b;                     // el deepEqual de Node es "loose"
  }
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  const ka = Object.keys(a), kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  return ka.every((k) => iguales(a[k], b[k]));
}

function crearAssert() {
  const fallo = (m, extra) => { throw new Error((m || "assert falló") + (extra || "")); };
  return {
    ok(v, m) { if (!v) fallo(m); },
    equal(a, b, m) { if (a != b) fallo(m, " (recibí " + JSON.stringify(a) + ", esperaba " + JSON.stringify(b) + ")"); },
    strictEqual(a, b, m) { if (a !== b) fallo(m); },
    deepEqual(a, b, m) { if (!iguales(a, b)) fallo(m, " (recibí " + JSON.stringify(a) + ", esperaba " + JSON.stringify(b) + ")"); },
    deepStrictEqual(a, b, m) { if (!iguales(a, b)) fallo(m); },
    throws(fn, m) {
      try { fn(); } catch { return; }
      fallo(m, " (no arrojó ningún error)");
    },
  };
}

function formatear(v) {
  if (typeof v === "string") return v;
  if (v === undefined) return "undefined";
  try { return JSON.stringify(v, null, 2); } catch { return String(v); }
}

/* ---------- construcción de una vista ---------- */
function construirVista(def) {
  const vista = document.createElement("div");
  vista.className = "vista";
  vista.id = "vista-" + def.id;

  /* --- columna 1: la lista --- */
  const colLista = document.createElement("div");
  colLista.className = "lista";
  const cab = document.createElement("div");
  cab.className = "cab";
  const ayuda = document.createElement("p");
  ayuda.textContent = def.ayuda;
  cab.append(ayuda);
  const nav = document.createElement("nav");
  colLista.append(cab, nav);

  /* --- columna 2: la descripción --- */
  const colDesc = document.createElement("div");
  colDesc.className = "desc";

  /* --- columna 3: el editor --- */
  const colEd = document.createElement("div");
  colEd.className = "editor";
  const barra = document.createElement("div");
  barra.className = "barra-arch";
  const pre = document.createElement("pre");
  const code = document.createElement("code");
  pre.append(code);
  const consola = document.createElement("div");
  consola.className = "consola";
  colEd.append(barra, pre, consola);

  vista.append(colLista, colDesc, colEd);

  let actual = def.items[0];
  let archivoActual = 0;

  function pintarNav() {
    nav.replaceChildren();
    let grupo = null;
    for (const item of def.items) {
      if (item.grupo && item.grupo !== grupo) {
        grupo = item.grupo;
        const h = document.createElement("div");
        h.className = "grupo";
        h.textContent = grupo;
        nav.append(h);
      }
      const b = document.createElement("button");
      b.textContent = item.titulo;
      if (item.origen) {
        const n = document.createElement("span");
        n.className = "n";
        n.textContent = item.origen;
        b.append(n);
      }
      b.classList.toggle("activo", item.id === actual.id);
      b.addEventListener("click", () => mostrar(item));
      nav.append(b);
    }
  }

  function pintarDesc() {
    colDesc.replaceChildren();
    colDesc.scrollTop = 0;

    const h2 = document.createElement("h2");
    h2.textContent = actual.titulo;
    colDesc.append(h2);

    if (actual.origen) {
      const badge = document.createElement("span");
      badge.className = "origen";
      badge.textContent = actual.origen;
      colDesc.append(badge);
    }
    if (actual.firma) {
      const f = document.createElement("code");
      f.className = "firma";
      f.textContent = actual.firma;
      colDesc.append(f);
    }

    const res = document.createElement("p");
    res.className = "resumen";
    res.textContent = actual.resumen;
    colDesc.append(res);

    if (actual.puntos && actual.puntos.length) {
      const h3 = document.createElement("h3");
      h3.textContent = "A tener en cuenta";
      colDesc.append(h3);
      for (const p of actual.puntos) {
        const d = document.createElement("div");
        d.className = "punto" + (p.tipo ? " " + p.tipo : "");
        const t = document.createElement("span");
        t.className = "t";
        t.textContent = (p.tipo === "trampa" ? "⚠ " : p.tipo === "error" ? "✕ " : "") + p.t;
        const dd = document.createElement("p");
        dd.className = "d";
        dd.innerHTML = p.d;     // las descripciones traen <code> a propósito
        d.append(t, dd);
        colDesc.append(d);
      }
    }
  }

  function pintarEditor() {
    barra.replaceChildren();

    actual.archivos.forEach((arch, i) => {
      const b = document.createElement("button");
      b.className = "arch" + (i === archivoActual ? " activo" : "");
      b.textContent = arch.nombre;
      b.addEventListener("click", () => { archivoActual = i; pintarEditor(); });
      barra.append(b);
    });

    const sep = document.createElement("span");
    sep.className = "sep";
    barra.append(sep);

    if (actual.ejecutar) {
      const run = document.createElement("button");
      run.className = "accion correr";
      run.textContent = "▶ Ejecutar";
      run.addEventListener("click", ejecutar);
      barra.append(run);
    }

    const copiar = document.createElement("button");
    copiar.className = "accion";
    copiar.textContent = "Copiar";
    copiar.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(actual.archivos[archivoActual].codigo);
        copiar.textContent = "¡copiado!";
      } catch { copiar.textContent = "no se pudo"; }
      setTimeout(() => { copiar.textContent = "Copiar"; }, 1200);
    });
    barra.append(copiar);

    const arch = actual.archivos[archivoActual];
    code.innerHTML = resaltar(arch.codigo, arch.lenguaje || "js");
    pre.scrollTop = 0;
  }

  function ejecutar() {
    consola.replaceChildren();
    consola.classList.add("visible");

    const linea = (txt, clase) => {
      const span = document.createElement("span");
      if (clase) span.className = clase;
      span.textContent = txt + "\n";
      consola.append(span);
    };

    linea("$ node " + actual.archivos[0].nombre, "tit");

    const log = (v, clase) => linea(formatear(v), clase);
    try {
      new Function("assert", "log", actual.ejecutar)(crearAssert(), log);
    } catch (error) {
      linea("");
      linea("AssertionError: " + error.message, "fail");
    }
    consola.scrollTop = consola.scrollHeight;
  }

  function mostrar(item) {
    actual = item;
    archivoActual = 0;
    consola.classList.remove("visible");
    consola.replaceChildren();
    pintarNav();
    pintarDesc();
    if (item.archivos && item.archivos.length) {
      pre.style.display = "";
      pintarEditor();
    } else {
      barra.replaceChildren();
      code.textContent = "";
      pre.style.display = "none";
    }
  }

  mostrar(def.items[0]);
  return vista;
}

/* ---------- pestañas ---------- */
const app = document.getElementById("app");
const tabsNav = document.getElementById("tabs");

for (const def of VISTAS) {
  app.append(construirVista(def));
  const b = document.createElement("button");
  b.textContent = def.tab;
  b.dataset.id = def.id;
  b.addEventListener("click", () => activar(def.id));
  tabsNav.append(b);
}

function activar(id) {
  document.querySelectorAll(".vista").forEach((v) => v.classList.toggle("activa", v.id === "vista-" + id));
  tabsNav.querySelectorAll("button").forEach((b) => b.classList.toggle("activo", b.dataset.id === id));
}

activar("parciales");
</script>
