`/*
# Ejercicio 03 - resuelto.

Al cargar se genera un duelo aleatorio. El usuario elige el ganador: eso hace
POST a la API, genera un duelo nuevo y recarga el historial.
*/

const PROMPTS = [
  "Explicame flexbox como si tuviera 5 años",
  "Escribí un mensaje para pedir prórroga del parcial",
  "Generá un plan de estudio para la prueba de DWYM",
  "¿Por qué mi CSS funciona en mi máquina y en la tuya no?",
  "Resumí este PDF de 300 páginas en un tweet",
  "Convertí este for anidado en algo que no dé vergüenza",
];

const MODELOS = [
  { nombre: "ChatGPT",  emoji: "🤖" },
  { nombre: "Claude",   emoji: "🧠" },
  { nombre: "Gemini",   emoji: "✨" },
  { nombre: "Copilot",  emoji: "💻" },
  { nombre: "Llama",    emoji: "🦙" },
  { nombre: "DeepSeek", emoji: "🔍" },
];

function elegirAlAzar(array) {
  return array[Math.floor(Math.random() * array.length)];
}

// EL ESTADO: el duelo que se está mostrando en este momento.
let currentCombo = null;

async function onLoad() {
  newCombo();
  await loadHistory();
}

function onWinA() { return saveCombo("A"); }
function onWinB() { return saveCombo("B"); }

/* Genera un duelo aleatorio y lo muestra en el recuadro. */
function newCombo() {
  const a = elegirAlAzar(MODELOS);
  let b = elegirAlAzar(MODELOS);
  // Dos modelos DISTINTOS. Funciona con === porque elegirAlAzar devuelve
  // la misma referencia del objeto que está en el array.
  while (b === a) {
    b = elegirAlAzar(MODELOS);
  }

  currentCombo = {
    prompt: elegirAlAzar(PROMPTS),
    modeloA: a.nombre,
    modeloB: b.nombre,
  };

  document.getElementById("prompt").textContent = "«" + currentCombo.prompt + "»";
  document.getElementById("modelo-a").textContent = a.nombre;
  document.getElementById("emo-a").textContent = a.emoji;
  document.getElementById("modelo-b").textContent = b.nombre;
  document.getElementById("emo-b").textContent = b.emoji;
}

/* Guarda el duelo con el veredicto y refresca todo. */
async function saveCombo(ganador) {
  try {
    await fetchJSON("/duelos", {
      method: "POST",
      // ← "ganador", el nombre que dice la consigna. NO "result".
      body: JSON.stringify({ ...currentCombo, ganador }),
    });
    newCombo();
    await loadHistory();
  } catch (error) {
    console.error(error);
  }
}

/* Pide el historial a la API y lo vuelve a dibujar dentro de #history. */
async function loadHistory() {
  const history = document.getElementById("history");
  try {
    const duelos = await fetchJSON("/duelos");
    history.replaceChildren(...duelos.map(dueloElement));
  } catch (error) {
    console.error(error);
    history.replaceChildren();
  }
}

/* Construye el <div class="duelo"> de un duelo guardado. */
function dueloElement(duelo) {
  const div = document.createElement("div");
  div.className = "duelo";

  const prompt = document.createElement("span");
  prompt.className = "duelo-prompt";
  prompt.textContent = "«" + duelo.prompt + "»";

  const resultado = document.createElement("span");
  resultado.className = "duelo-resultado";
  resultado.textContent = duelo.ganador === "A"
    ? duelo.modeloA + " 🏆 vs " + duelo.modeloB
    : duelo.modeloA + " vs " + duelo.modeloB + " 🏆";

  div.append(prompt, resultado);
  return div;
}

/* El helper que conviene escribir SIEMPRE primero. */
async function fetchJSON(path, options) {
  const resource = new URL(path, window.location);
  const response = await window.fetch(resource, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...options?.headers,
    },
  });
  if (response.ok) {
    return await response.json();
  } else {
    throw new Error("Error " + response.status + ": " + response.statusText);
  }
}` },

`/*
# Ejercicio 03 - resuelto.

Al cargar se genera una combinación aleatoria de color de texto y de fondo. El
usuario la aprueba (👍) o la rechaza (👎); en ambos casos se envía por POST, se
genera una nueva y se recarga el historial.
*/

// EL ESTADO: la combinación que se está mostrando.
let currentCombo = null;

async function onLoad() {
  newCombo();
  await loadHistory();
}

// Dos botones, una sola función de guardado con distinto argumento.
function onApprove() { return saveCombo(true); }
function onReject()  { return saveCombo(false); }

/* Genera una combinación aleatoria y la muestra en #preview. */
function newCombo() {
  currentCombo = {
    backgroundColor: randomColor(),
    textColor: randomColor(),
  };

  return luminance > 0.5 ? '#000000' : '#ffffff';
}

`/*
# Ejercicio 04 - Mini-Contacts API (resuelto)

Levantar con:  npx json-server db.json -s .
*/

const API = 'http://localhost:3000/users';

// Orden de roles: convertir "siguiente/anterior" en un índice es más simple
// que una cadena de ifs.
const ROLES = ['Viewer', 'Editor', 'Admin'];

function onLoad() {
  document.getElementById('add').addEventListener('click', addUser);
  loadUsers();
}

/* ─── 1. LISTAR ────────────────────────────────────────────── */
async function loadUsers() {
  const list = document.getElementById('users');
  try {
    const users = await fetchJSON(API);
    list.replaceChildren(...users.map(userElement));
  } catch (error) {
    console.error(error);
    list.replaceChildren();
  }
}

function userElement(user) {
  const li = document.createElement('li');

  const info = document.createElement('span');
  info.textContent = user.name + ' / ' + user.role + ' / ' + user.email;
  li.append(info, ' ');

  // Cada flecha "se acuerda" de QUÉ user era: eso es un closure.
  // No hace falta guardar el id en un data-attribute.
  li.append(
    button('Promote', () => changeRole(user, +1)),
    button('Demote',  () => changeRole(user, -1)),
    button('Delete',  () => deleteUser(user)),
  );
  return li;
}

/* Fábrica de botones: se repite en TODOS los ejercicios de este tipo. */
function button(label, onClick, disabled = false) {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = label;
  b.disabled = disabled;
  b.addEventListener('click', onClick);
  return b;
}

/* ─── 2. CREAR (POST) ──────────────────────────────────────── */
async function addUser() {
  const name = document.getElementById('name');
  const email = document.getElementById('email');
  const role = document.getElementById('role');

  if (!name.value.trim() || !email.value.trim()) {
    console.warn('Name y Email son obligatorios.');
    return;
  }

  try {
    await fetchJSON(API, {
      method: 'POST',
      body: JSON.stringify({
        name: name.value.trim(),
        email: email.value.trim(),
        role: role.value,
      }),
    });
    // Limpiar DESPUÉS del await: si el POST falla, no se pierde lo escrito.
    name.value = '';
    email.value = '';
    role.selectedIndex = 0;
    await loadUsers();
  } catch (error) {
    console.error(error);
  }
}

/* ─── 3. MODIFICAR UN CAMPO (PATCH) ────────────────────────── */
async function changeRole(user, delta) {
  const index = ROLES.indexOf(user.role);
  const nextIndex = Math.min(ROLES.length - 1, Math.max(0, index + delta));
  if (nextIndex === index) {
    return;                    // ya está en el extremo: no hacemos nada
  }
  try {
    await fetchJSON(API + '/' + user.id, {
      method: 'PATCH',
      // PATCH manda SOLO lo que cambia. name y email quedan intactos.
      body: JSON.stringify({ role: ROLES[nextIndex] }),
    });
    await loadUsers();
  } catch (error) {
    console.error(error);
  }
}

/* ─── 4. BORRAR (DELETE) ───────────────────────────────────── */
async function deleteUser(user) {
  try {
    await fetchJSON(API + '/' + user.id, { method: 'DELETE' });
    await loadUsers();         // recargar, no borrar el <li> a mano
  } catch (error) {
    console.error(error);
  }
}

async function fetchJSON(url, options) {
  const response = await fetch(url, {
    ...options,
    headers: { 'Content-Type': 'application/json', ...options?.headers },
  });
  if (!response.ok) {
    throw new Error('Error ' + response.status + ': ' + response.statusText);
  }
  // DELETE puede devolver 204 sin cuerpo: response.json() explotaría.
  return response.status === 204 ? null : await response.json();
}` },

async function buyOne(product) {

  try {
    await fetchJSON(API + '/' + product.id, {

      body: JSON.stringify({ ...product, stock: product.stock - 1 }),
    });
    await loadProducts();
  } catch (error) {
    console.error(error);
  }
}

async function fetchJSON(url, options) {
  const response = await fetch(url, {
    ...options,

/* ─── 1. El helper. Escribilo PRIMERO, siempre igual ────────── */
async function fetchJSON(path, options) {
  const resource = new URL(path, window.location);
  const response = await window.fetch(resource, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      ...options?.headers,
    },
  });
  if (!response.ok) {
    throw new Error('Error ' + response.status + ': ' + response.statusText);
  }
  // DELETE puede devolver 204 sin cuerpo: json() explotaría.
  return response.status === 204 ? null : await response.json();
}

/* ─── 2. Cargar y dibujar ───────────────────────────────────── */
async function loadItems() {

    ...options,

    //    SIN Content-Type, json-server no parsea el body.

  }

  // ⑤ DELETE puede devolver 204 sin cuerpo: json() explotaría.
  return response.status === 204 ? null : await response.json();

const VISTAS = [PARCIALES, ESQUELETO, DOM, FETCH, EVENTOS, CHULETA];

/* ---------- escapado y resaltado ---------- */
function escapar(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const PALABRAS = new RegExp(
  "\\b(const|let|var|function|return|if|else|for|of|in|while|switch|case|default|" +
  "break|continue|throw|new|typeof|instanceof|export|import|from|with|class|" +
  "try|catch|finally|async|await|true|false|null|undefined|this|document|window)\\b", "g");

function resaltar(codigo, lenguaje) {
  let out = escapar(codigo);
  if (lenguaje === "texto") return out;

  // Los comentarios y los strings se guardan primero detrás de un marcador
  // del area de uso privado de Unicode, para que los pasos siguientes no
  // los toquen.
  const guardado = [];
  const guardar = (clase) => (m) => {
    guardado.push('<span class="' + clase + '">' + m + "</span>");
    return String.fromCharCode(0xE100 + guardado.length - 1);
  };

  if (lenguaje === "html") {
    out = out.replace(/&lt;!--[\s\S]*?--&gt;/g, guardar("cmt"));
    out = out.replace(/"(?:[^"\\\n]|\\.)*"/g, guardar("str"));
    // El orden importa: primero los atributos, después los nombres de
    // etiqueta. Al revés, el segundo replace matchearía el class="tag"
    // que acabamos de insertar nosotros.
    out = out.replace(/\b([a-zA-Z-]+)(?==)/g, '<span class="atr">$1</span>');
    out = out.replace(/&lt;(\/?)([a-zA-Z0-9-]+)/g, '&lt;$1<span class="tag">$2</span>');
  } else {
    out = out.replace(/\/\*[\s\S]*?\*\//g, guardar("cmt"));
    out = out.replace(/\/\/[^\n]*/g, guardar("cmt"));
    out = out.replace(/`(?:[^`\\]|\\.)*`/g, guardar("str"));
    out = out.replace(/"(?:[^"\\\n]|\\.)*"/g, guardar("str"));
    out = out.replace(/'(?:[^'\\\n]|\\.)*'/g, guardar("str"));

    if (lenguaje !== "json" && lenguaje !== "css") {
      out = out.replace(PALABRAS, '<span class="kw">$1</span>');
      out = out.replace(/\b([a-zA-Z_$][\w$]*)(?=\()/g, '<span class="fn">$1</span>');
    }
    if (lenguaje === "css") {
      out = out.split("\n").map((l) =>
        l.indexOf("<span") !== -1 ? l : l.replace(/^(\s*)([a-z-]+)(\s*:)/, '$1<span class="fn">$2</span>$3')
      ).join("\n");
    }
    out = out.replace(/\b(\d[\d_.]*)\b/g, '<span class="num">$1</span>');
  }

  return out.replace(/[\uE100-\uF8FF]/g, (ch) => guardado[ch.charCodeAt(0) - 0xE100]);
}

/* ==========================================================================
   LA API FALSA
   Se inyecta dentro del iframe del demo y reemplaza window.fetch por una
   funcion que guarda los datos en memoria y responde igual que json-server.
   Asi el CRUD de los demos funciona sin levantar ningun servidor.
   ========================================================================== */
const API_FALSA = `
(function () {
  const db = __DB__;
  let seq = 1000;
  const nuevoId = () => "gen" + (seq += 1);

  const log = (txt, clase) => {
    try { window.parent.postMessage({ tipo: "demo-log", txt: txt, clase: clase }, "*"); } catch (e) {}
  };

  // El codigo real hace new URL(path, window.location). Dentro de este
  // iframe window.location es "about:srcdoc" y eso hace explotar a URL.
  // Le damos un origen ficticio para que el codigo del ejercicio corra
  // tal cual esta escrito, sin tocarle una linea.
  const OrigURL = window.URL;
  function URLDemo(u, base) {
    try { return new OrigURL(u, base); }
    catch (e) { return new OrigURL(String(u), "https://demo.local/"); }
  }
  URLDemo.prototype = OrigURL.prototype;
  if (OrigURL.createObjectURL) URLDemo.createObjectURL = OrigURL.createObjectURL.bind(OrigURL);
  window.URL = URLDemo;

  function respuesta(status, cuerpo) {
    const textos = { 200: "OK", 201: "Created", 404: "Not Found", 400: "Bad Request" };
    return {
      ok: status >= 200 && status < 300,
      status: status,
      statusText: textos[status] || "",
      json: async () => cuerpo,
      text: async () => JSON.stringify(cuerpo),
    };
  }

  window.fetch = async function (recurso, opciones) {
    const opts = opciones || {};
    const metodo = (opts.method || "GET").toUpperCase();

    // El path, sin origen ni query string
    let camino = String(recurso);
    camino = camino.replace(/^[a-z]+:\\/\\/[^/]*/i, "").split("?")[0];
    const partes = camino.split("/").filter(Boolean);
    const coleccion = partes[0];
    const id = partes[1];

    let cuerpo = null;
    if (opts.body !== undefined && opts.body !== null) {
      // Si te olvidaste JSON.stringify, opts.body es un objeto y al
      // convertirlo a string queda "[object Object]": no parsea.
      try { cuerpo = JSON.parse(String(opts.body)); }
      catch (e) {
        log(metodo + " " + camino + "  400  (el body no es JSON valido)", "fail");
        return respuesta(400, { error: "body invalido" });
      }
    }

    if (!coleccion || !Object.prototype.hasOwnProperty.call(db, coleccion)) {
      log(metodo + " " + camino + "  404", "fail");
      return respuesta(404, {});
    }

    const lista = db[coleccion];
    const indice = id === undefined ? -1 : lista.findIndex((x) => String(x.id) === String(id));

    if (metodo === "GET") {
      if (id === undefined) {
        log("GET " + camino + "  200  (" + lista.length + " items)");
        return respuesta(200, JSON.parse(JSON.stringify(lista)));
      }
      if (indice === -1) { log("GET " + camino + "  404", "fail"); return respuesta(404, {}); }
      log("GET " + camino + "  200");
      return respuesta(200, JSON.parse(JSON.stringify(lista[indice])));
    }

    if (metodo === "POST") {
      const nuevo = Object.assign({}, cuerpo, { id: (cuerpo && cuerpo.id) || nuevoId() });
      lista.push(nuevo);
      log("POST " + camino + "  201  " + JSON.stringify(cuerpo));
      return respuesta(201, nuevo);
    }

    if (indice === -1) { log(metodo + " " + camino + "  404", "fail"); return respuesta(404, {}); }

    if (metodo === "PATCH") {
      Object.assign(lista[indice], cuerpo);      // solo pisa lo que le mandes
      log("PATCH " + camino + "  200  " + JSON.stringify(cuerpo));
      return respuesta(200, lista[indice]);
    }

    if (metodo === "PUT") {
      // PUT REEMPLAZA: lo unico que sobrevive es el id.
      lista[indice] = Object.assign({}, cuerpo, { id: lista[indice].id });
      log("PUT " + camino + "  200  " + JSON.stringify(cuerpo));
      return respuesta(200, lista[indice]);
    }

    if (metodo === "DELETE") {
      lista.splice(indice, 1);
      log("DELETE " + camino + "  200");
      return respuesta(200, {});
    }

    log(metodo + " " + camino + "  400", "fail");
    return respuesta(400, {});
  };

  // console.log / error del demo tambien van a la consola de abajo
  const origLog = console.log, origErr = console.error;
  console.log = function () {
    origLog.apply(console, arguments);
    log([].slice.call(arguments).map(String).join(" "), "tit");
  };
  console.error = function () {
    origErr.apply(console, arguments);
    log([].slice.call(arguments).map(String).join(" "), "fail");
  };
})();
`;

/* ---------- armar el documento del demo ---------- */
function documentoDemo(item) {
  const d = item.demo || {};
  const archivos = item.archivos || [];
  const buscar = (ext) => (archivos.find((a) => a.nombre.endsWith(ext)) || {}).codigo || "";

  let html = d.html !== undefined ? d.html : buscar(".html");
  const css = d.css !== undefined ? d.css : buscar(".css");
  const js = d.js !== undefined ? d.js : buscar(".js");

  // Del archivo .html solo interesa el contenido del <body> y su onload.
  let init = d.init || "";
  const m = /<body([^>]*)>([\s\S]*?)<\/body>/i.exec(html);
  if (m) {
    html = m[2];
    const attr = /onload\s*=\s*"([^"]*)"/i.exec(m[1]);
    if (attr && !init) init = attr[1];
  }
  // Los <script src="..."> del HTML apuntan a archivos que no existen aca.
  html = html.replace(/<script[\s\S]*?<\/script>/gi, "");

  const mock = d.db ? API_FALSA.replace("__DB__", d.db) : "";

  return '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width, initial-scale=1">' +
    "<style>" + css + "</style></head><body>" + html +
    (mock ? "<script>" + mock + "<\/script>" : "") +
    "<script>try{" + js + "\n" + init + "}catch(e){console.error(e.message)}<\/script>" +
    "</body></html>";
}

  vista.append(colLista, colDesc, colEd);

  let actual = def.items[0];
  let archivoActual = 0;

  function pintarNav() {

        grupo = item.grupo;
        const h = document.createElement("div");
        h.className = "grupo";
        h.textContent = grupo;
        nav.append(h);

      h3.textContent = "A tener en cuenta";
      colDesc.append(h3);
      for (const p of actual.puntos) {
        const d = document.createElement("div");
        d.className = "punto" + (p.tipo ? " " + p.tipo : "");
        const t = document.createElement("span");
        t.className = "t";
        t.textContent = (p.tipo === "trampa" ? "⚠ " : p.tipo === "error" ? "✕ " : "") + p.t;
        const dd = document.createElement("p");
        dd.className = "d";
        dd.innerHTML = p.d;     // las descripciones traen <code> a proposito
        d.append(t, dd);
        colDesc.append(d);
      }
    }
  }

  function pintarBarra() {
    barra.replaceChildren();

    actual.archivos.forEach((arch, i) => {
      const b = document.createElement("button");
      b.className = "arch" + (!enDemo && i === archivoActual ? " activo" : "");
      b.textContent = arch.nombre;
      b.addEventListener("click", () => {
        archivoActual = i;
        enDemo = false;
        pintarEditor();
      });
      barra.append(b);
    });

    const sep = document.createElement("span");
    sep.className = "sep";
    barra.append(sep);

    if (actual.demo) {
      const run = document.createElement("button");
      run.className = "accion correr" + (enDemo ? " activo" : "");
      run.textContent = enDemo ? "■ Ver el codigo" : "▶ Ver funcionando";
      run.addEventListener("click", () => { enDemo = !enDemo; pintarEditor(); });
      barra.append(run);
    }

    const copiar = document.createElement("button");
    copiar.className = "accion";
    copiar.textContent = "Copiar";
    copiar.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(actual.archivos[archivoActual].codigo);
        copiar.textContent = "copiado";
      } catch (e) { copiar.textContent = "no se pudo"; }
      setTimeout(() => { copiar.textContent = "Copiar"; }, 1200);
    });
    barra.append(copiar);
  }

  function pintarEditor() {
    pintarBarra();

    if (enDemo) {
      pre.style.display = "none";
      zonaDemo.classList.add("visible");
      consola.classList.add("visible");
      consola.replaceChildren();
      avisoDemo.textContent = actual.demo.aviso || "";
      avisoDemo.style.display = actual.demo.aviso ? "" : "none";
      marco.srcdoc = documentoDemo(actual);
    } else {
      pre.style.display = "";
      zonaDemo.classList.remove("visible");
      consola.classList.remove("visible");
      marco.srcdoc = "";
      const arch = actual.archivos[archivoActual];
      code.innerHTML = resaltar(arch.codigo, arch.lenguaje || "js");
      pre.scrollTop = 0;
    }
  }

  function mostrar(item) {
    actual = item;
    archivoActual = 0;
    enDemo = false;
    consola.replaceChildren();
    pintarNav();
    pintarDesc();
    pintarEditor();
  }

  vista.__consola = consola;
  mostrar(def.items[0]);
  return vista;
}

/* ---------- pestanas ---------- */
const app = document.getElementById("app");
const tabsNav = document.getElementById("tabs");

for (const def of VISTAS) {
  app.append(construirVista(def));
  const b = document.createElement("button");
  b.textContent = def.tab;
  b.dataset.id = def.id;
  b.addEventListener("click", () => activar(def.id));
  tabsNav.append(b);
}

function activar(id) {
  document.querySelectorAll(".vista").forEach((v) => v.classList.toggle("activa", v.id === "vista-" + id));
  tabsNav.querySelectorAll("button").forEach((b) => b.classList.toggle("activo", b.dataset.id === id));
}

/* Los demos mandan sus requests y sus console.log por postMessage. */
window.addEventListener("message", (event) => {
  const datos = event.data;
  if (!datos || datos.tipo !== "demo-log") return;
  const vista = document.querySelector(".vista.activa");
  if (!vista || !vista.__consola) return;
  const span = document.createElement("span");
  if (datos.clase) span.className = datos.clase;
  else span.className = "net";
  span.textContent = datos.txt + "\n";
  vista.__consola.append(span);
  vista.__consola.scrollTop = vista.__consola.scrollHeight;
});

activar("parciales");
</script>
