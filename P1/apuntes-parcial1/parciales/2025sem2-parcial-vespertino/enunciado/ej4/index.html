<!DOCTYPE html>
<html>
  <head>
    <title>Ejercicio 4</title>
  </head>
  <body>
    <input id="title" name="title" placeholder="Title" required />
    <input
      id="price"
      name="price"
      type="number"
      step="0.01"
      min="0"
      placeholder="Price"
      required
    />
    <input
      id="stock"
      name="stock"
      type="number"
      step="1"
      min="0"
      placeholder="Stock"
      required
    />
    <input id="category" name="category" placeholder="Category" required />
    <button>Add product</button>
    <ul id="products"></ul>
  </body>
</html>
