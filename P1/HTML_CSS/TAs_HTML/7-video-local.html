<!--
    TA 7
    En un nuevo documento HTML, utilizar un tag apropiado para mostrar un video
    que se tenga a nivel local.
-->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeo local</title>
</head>

<body>
    <video controls width="640">
        <source src="video.mp4" type="video/mp4">
        Tu navegador no admite la reproducción de vídeo.
    </video>
</body>

</html>
