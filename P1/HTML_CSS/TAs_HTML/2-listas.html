<!--
    TA 2
    En un nuevo documento HTML, crear una lista ordenada (<ol>) y una lista
    desordenada (<ul>) dentro de la sección <body>, cada una con tres elementos
    de lista (<li>).
-->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas HTML</title>
</head>

<body>
    <h2>Lista ordenada</h2>
    <ol>
        <li>Primer elemento</li>
        <li>Segundo elemento</li>
        <li>Tercer elemento</li>
    </ol>

    <h2>Lista desordenada</h2>
    <ul>
        <li>Primer elemento</li>
        <li>Segundo elemento</li>
        <li>Tercer elemento</li>
    </ul>
</body>

</html>
