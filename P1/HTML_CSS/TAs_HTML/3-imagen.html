<!--
    TA 3
    En un nuevo documento HTML, agregar una imagen (<img>) dentro de la sección
    <body>, utilizando el atributo src para especificar la URL del archivo de
    imagen.
-->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagen HTML</title>
</head>

<body>
    <img src="https://ejemplo.com/imagen.jpg" alt="Descripción de la imagen">
</body>

</html>
