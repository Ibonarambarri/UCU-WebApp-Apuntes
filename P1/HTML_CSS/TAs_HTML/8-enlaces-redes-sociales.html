<!--
    TA 8
    En un nuevo documento HTML, utilizar el tag <a> para tener 3 links, que
    lleven a Google, Facebook e Instagram.
-->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlaces</title>
</head>

<body>
    <a href="https://www.google.com">Google</a>
    <a href="https://www.facebook.com">Facebook</a>
    <a href="https://www.instagram.com">Instagram</a>
</body>

</html>
