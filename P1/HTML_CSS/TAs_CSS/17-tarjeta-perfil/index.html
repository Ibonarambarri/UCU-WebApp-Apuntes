<!--
    TA 17
    Objetivo: Crear una tarjeta de perfil centrada en la página utilizando diferentes
    técnicas de posicionamiento en CSS.
    Instrucciones:
      Estructura HTML: crea una tarjeta de perfil (div) que contenga una imagen (img)
        que represente el avatar de la persona, un título (h2) con el nombre de la
        persona, un párrafo (p) con una breve descripción o biografía y un botón
        (button) para seguir o contactar a la persona.
      Estilo para la Tarjeta: la tarjeta debe estar centrada tanto vertical como
        horizontalmente en la página. Debe tener un ancho fijo de 300px y un relleno
        (padding) de 20px. Redondea las esquinas de la tarjeta utilizando
        border-radius.
      Posicionamiento del Avatar: el avatar debe estar absolutamente posicionado en la
        esquina superior izquierda de la tarjeta, parcialmente superpuesto con el
        borde superior de la tarjeta. Aplica un borde circular al avatar utilizando
        border-radius: 50%.
      Centrado del Contenido: el nombre, descripción y botón deben estar centrados
        horizontalmente dentro de la tarjeta. Usa text-align: center para centrar el
        texto.
-->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de perfil</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="tarjeta">
        <img class="avatar" src="avatar.svg" alt="Avatar de Ana Martínez">
        <h2>Ana Martínez</h2>
        <p>Desarrolladora web y estudiante de Ingeniería. Le gusta el diseño de interfaces y el café bien cargado.</p>
        <button>Seguir</button>
    </div>
</body>

</html>
