<!--
    TA 10
    En un nuevo documento HTML, crear 3 elementos. A estos 3 elementos se le debe
    agregar estilos, usando para cada uno de ellos un método diferente para agregar
    CSS. Se pide usar sólamente selectores de tipo para este ejercicio al agregar
    estilos mediante los métodos externos e internos. También usar palabras clave
    para los colores (por ejemplo, "blue") en lugar de valores RGB o HEX.
    Los 3 elementos a estilar son:
      div: un fondo rojo, texto blanco, un tamaño de fuente de 32px, alineación
           centrada y negrita
      p: un fondo verde, texto blanco y un tamaño de fuente de 18px
      button: un fondo naranja y un tamaño de fuente de 18px

    Nota: este ejercicio pide expresamente los tres métodos, por lo que el CSS no
    se separa por completo del HTML: el div usa el método externo (style.css), el p
    el método interno (<style>) y el button el método inline (atributo style).
-->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Métodos para agregar CSS</title>

    <!-- Método externo -->
    <link rel="stylesheet" href="style.css">

    <!-- Método interno -->
    <style>
        p {
            background-color: green;
            color: white;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div>Style me via the external method!</div>
    <p>I would like to be styled with the internal method, please.</p>

    <!-- Método inline -->
    <button style="background-color: orange; font-size: 18px;">Inline Method</button>
</body>

</html>
