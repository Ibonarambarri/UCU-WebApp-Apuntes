<!--
    TA 16
    Objetivo: Mostrar y ocultar un elemento al hacer clic en un botón.
    Instrucciones:
      Crear un archivo HTML con un elemento <p>, con un texto cualquiera.
      Añadir un botón que diga "Mostrar/Ocultar".
      Al hacer clic en el botón, el párrafo debe ocultarse si está visible y
        mostrarse si está oculto.
-->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mostrar / Ocultar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>TA 16 - Mostrar / Ocultar</h1>

    <p id="parrafo">Este párrafo se puede mostrar y ocultar con el botón de abajo.</p>
    <button id="boton-alternar">Mostrar/Ocultar</button>

    <script src="script.js"></script>
</body>

</html>
