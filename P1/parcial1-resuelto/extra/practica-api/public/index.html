<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Práctica — DOM + API</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>

<body onload="onLoad()">
  <main id="content">
    <h1>Tareas</h1>

    <!-- Formulario: submit real, para practicar preventDefault -->
    <form id="task-form">
      <input id="title" name="title" placeholder="Nueva tarea…" required>
      <input id="priority" name="priority" type="number" min="1" max="5" value="3" required>
      <button type="submit">Agregar</button>
    </form>

    <div id="filters">
      <label><input type="checkbox" id="only-pending"> Ver sólo pendientes</label>
      <span id="counter"></span>
    </div>

    <ul id="tasks"></ul>
  </main>
</body>

</html>
