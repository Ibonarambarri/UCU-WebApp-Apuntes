<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Ejercicio 4 - Mini-Products API</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="ej04.js" defer></script>
  </head>
  <body onload="onLoad()">
    <h1>Mini-Products</h1>

    <div id="form">
      <input id="title" name="title" placeholder="Title" required />
      <input id="price" name="price" type="number" step="0.01" min="0" placeholder="Price" required />
      <input id="stock" name="stock" type="number" step="1" min="0" placeholder="Stock" required />
      <input id="category" name="category" placeholder="Category" required />
      <button id="add-product">Add product</button>
    </div>

    <ul id="products"></ul>
  </body>
</html>
