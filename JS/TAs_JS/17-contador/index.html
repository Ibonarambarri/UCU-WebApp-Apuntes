<!--
    TA 17
    Objetivo: Crear un contador que aumente cada vez que se hace clic en un botón.
    Instrucciones:
      Crear un archivo HTML con un elemento <p> con el número 0.
      Añadir un botón con el texto "Incrementar".
      Al hacer clic en el botón, el número dentro del <span> debe incrementarse en
        uno.
-->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>TA 17 - Contador</h1>

    <p>Clics: <span id="contador">0</span></p>
    <button id="boton-incrementar">Incrementar</button>

    <script src="script.js"></script>
</body>

</html>
