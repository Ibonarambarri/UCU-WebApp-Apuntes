<!--
    TA 14
    Objetivo: Añadir nuevos elementos a una lista al hacer clic en un botón.
    Instrucciones:
      Crear una lista <ul> vacía en un archivo HTML.
      Añadir un input y un botón que diga "Añadir elemento".
      Al escribir texto en el input y hacer clic en el botón, se debe añadir un
        nuevo <li> con el texto ingresado a la lista, y el texto del input debe
        borrarse.
-->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Añadir elemento a la lista</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>TA 14 - Añadir elementos a una lista</h1>

    <input type="text" id="entrada" placeholder="Escribe un elemento">
    <button id="boton-anadir">Añadir elemento</button>

    <ul id="lista"></ul>

    <script src="script.js"></script>
</body>

</html>
