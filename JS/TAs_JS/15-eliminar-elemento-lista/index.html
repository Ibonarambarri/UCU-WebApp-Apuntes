<!--
    TA 15
    Objetivo: Eliminar un elemento específico de la lista.
    Instrucciones:
      Usando una copia del HTML anterior, agregar un botón "Eliminar último
        elemento".
      Al hacer clic en el botón, se debe eliminar el último <li> de la lista.
-->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar elemento de la lista</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>TA 15 - Eliminar el último elemento de una lista</h1>

    <input type="text" id="entrada" placeholder="Escribe un elemento">
    <button id="boton-anadir">Añadir elemento</button>
    <button id="boton-eliminar">Eliminar último elemento</button>

    <ul id="lista"></ul>

    <script src="script.js"></script>
</body>

</html>
