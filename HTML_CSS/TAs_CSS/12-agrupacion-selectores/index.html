<!--
    TA 12
    Agregar un archivo CSS externo que aplique estilos a los elementos de la
    siguiente manera:
      El primer elemento: un fondo negro y texto blanco
      El segundo elemento: un fondo amarillo
      Ambos elementos: un tamaño de fuente de 28px y una lista de fuentes que
        contenga Helvetica y Times New Roman, con sans-serif como alternativa
    La idea de este ejercicio es identificar qué reglas CSS se comparten entre ambos
    elementos, para poder combinar selectores y no repetir reglas y cuáles son
    únicas para cada elemento. Cada elemento debe tener un único selector de clase
    aplicado.
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grouping Selectors</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <button class="oscuro">Click Me!</button>
    <button class="brillante">No, Click Me!</button>
</body>

</html>
