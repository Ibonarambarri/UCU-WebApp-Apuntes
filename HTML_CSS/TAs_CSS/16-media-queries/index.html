<!--
    TA 16
    Objetivo: Combinar el uso de media queries para cambiar el color de fondo, el
    tamaño del texto y el tamaño de una imagen en función del ancho de la pantalla.
    Se pide:
      Crea una página HTML básica, que contenga un encabezado con un texto a elección.
      Insertar una imagen en el centro de la página
      Agregar un párrafo con texto debajo de la imágen
    Estilo por defecto para pantallas grandes (1440px):
      El color de fondo de la página debe ser rojo.
      El tamaño del texto del párrafo debe ser 24px.
      La imagen debe ocupar el 50% del ancho de la pantalla
    Pantallas medianas (768px):
      El color de fondo debe cambiar a verde.
      El tamaño del texto del párrafo debe reducirse a 18px.
      La imagen debe ocupar el 70% del ancho de la pantalla.
    Pantallas pequeñas (425px):
      El color de fondo debe cambiar a azul.
      El tamaño del texto del párrafo debe reducirse a 14px.
      La imagen debe ocupar el 100% del ancho de la pantalla.
-->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media queries</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Diseño adaptable con media queries</h1>

    <img src="paisaje.svg" alt="Paisaje con montañas y un sol">

    <p>Al cambiar el ancho de la ventana del navegador, el color de fondo de la página, el tamaño de este texto y el
        ancho de la imagen se van ajustando gracias a las media queries definidas en la hoja de estilos.</p>
</body>

</html>
