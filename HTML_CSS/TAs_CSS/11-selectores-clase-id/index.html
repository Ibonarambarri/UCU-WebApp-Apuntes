<!--
    TA 11
    Agregue un archivo CSS externo que, utilizando selectores de clase y de id, le
    permita cumplir con lo siguiente:
      Todos los elementos impares: un fondo rojo claro/rosa, y una lista de fuentes
        que contenga Verdana y DejaVu Sans con sans-serif como alternativa
      El segundo elemento: texto azul y un tamaño de fuente de 36px
      El tercer elemento: además de los estilos para todos los elementos impares,
        agrega un tamaño de fuente de 24px
      El cuarto elemento: un fondo verde claro, un tamaño de fuente de 24px y negrita
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class and ID Selectors</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <p class="impar">Number 1 - I'm a class!</p>
    <div id="segundo">Number 2 - I'm one ID.</div>
    <p class="impar cooler">Number 3 - I'm a class, but cooler!</p>
    <div id="cuarto">Number 4 - I'm another ID.</div>
    <p class="impar">Number 5 - I'm a class!</p>
</body>

</html>
